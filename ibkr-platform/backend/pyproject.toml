[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "ibkr-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "pydantic-settings>=2.10,<3", "pymongo>=4.13,<5", "redis>=6,<8", "ib_async>=2.1,<3", "pwdlib[argon2]>=0.3,<1", "httpx>=0.28,<1", "cryptography>=44,<48"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "fakeredis[lua]>=2.30,<3", "mongomock-motor>=0.0.36,<1",  "ruff>=0.12,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
