name: ibkr-platform
x-backend-env: &backend-env
  MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
  MONGODB_DATABASE: ${MONGODB_DATABASE:-ibkr_rms_live}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://sattvic-rms.ekalonsolutions.com}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SECRET_KEY: ${SECRET_KEY:-}
  BOOTSTRAP_TENANT_SLUG: ${BOOTSTRAP_TENANT_SLUG:-saatvik}
  BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-Saatvik}
  # Read only by `python -m app.migrate`, to adopt a pre-tenancy gateway.
  IBKR_HOST: ${IBKR_HOST:-host.docker.internal}
  IBKR_PORT: ${IBKR_PORT:-4001}
  IBKR_CLIENT_ID: ${IBKR_CLIENT_ID:-17}
  IBKR_ACCOUNT: ${IBKR_ACCOUNT:-}
  IBC_CONFIG_PATH: ${IBC_CONFIG_PATH:-/opt/ibc/config.ini}
  IBC_LOG_DIRECTORY: ${IBC_LOG_DIRECTORY:-/opt/ibc/logs}
  GATEWAY_LAUNCHER_LOG: ${GATEWAY_LAUNCHER_LOG:-}
  GATEWAY_SERVICE: ${GATEWAY_SERVICE:-ibkr-gateway.service}
  # Provisioning writes IBC configs and systemd units on the *host*, which a
  # container cannot do, so it is off by default under Compose. Register
  # connections against paths and units an operator created, or run the API and
  # worker on the host (see deploy/README.md).
  GATEWAY_PROVISIONING_ENABLED: ${GATEWAY_PROVISIONING_ENABLED:-false}
  GATEWAY_INSTANCE_ROOT: ${GATEWAY_INSTANCE_ROOT:-/opt/ibc/instances}
  GATEWAY_INSTANCE_UNIT: ${GATEWAY_INSTANCE_UNIT:-ibkr-gateway@{instance}.service}
  GATEWAY_TEMPLATE_CONFIG: ${GATEWAY_TEMPLATE_CONFIG:-/opt/ibc/config.ini}
  GATEWAY_LOG_ROOT: ${GATEWAY_LOG_ROOT:-/var/log/ibc}
  GATEWAY_PORT_RANGE_START: ${GATEWAY_PORT_RANGE_START:-4100}
  GATEWAY_PORT_RANGE_END: ${GATEWAY_PORT_RANGE_END:-4199}
  SNAPTRADE_CLIENT_ID: ${SNAPTRADE_CLIENT_ID:-}
  SNAPTRADE_CONSUMER_KEY: ${SNAPTRADE_CONSUMER_KEY:-}
  SNAPTRADE_REDIRECT_URI: ${SNAPTRADE_REDIRECT_URI:-}
  SNAPTRADE_POLL_SECONDS: ${SNAPTRADE_POLL_SECONDS:-60}
services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --appendfsync, always, --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    extra_hosts: [host.docker.internal:host-gateway]
    environment: *backend-env
    depends_on:
      mongodb: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  ibkr-worker:
    build:
      context: .
      dockerfile: services/ibkr-worker/Dockerfile
    restart: unless-stopped
    environment: *backend-env
    extra_hosts: [host.docker.internal:host-gateway]
    depends_on:
      mongodb: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      backend: {condition: service_healthy}
  edge:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["${WEB_PORT:-3000}:80"]
    volumes: [./infra/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [backend, frontend]
volumes:
  mongo_data:
  redis_data:
